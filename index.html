<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>Cassa Backgammon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4efe6; --card:#fffdf8; --ink:#22201c; --muted:#6f685d; --line:#e3dacb;
  --felt:#1f4d3a; --felt2:#2d6a51; --on-felt:#fdf8ee;
  --a:#b5452f; --a-soft:#f6dcd4; --b:#2f5f8f; --b-soft:#d6e4f2;
  --gold:#c89b3c; --danger:#a33; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141714; --card:#1d211d; --ink:#ece6da; --muted:#a39b8c; --line:#2f352f;
    --felt:#1a3d2f; --felt2:#25543f; --on-felt:#f3ecdf;
    --a:#e07a62; --a-soft:#3a2420; --b:#6fa3d6; --b-soft:#1d2b3a; --gold:#d8b25a; --danger:#e06666;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{background:var(--felt);color:var(--on-felt);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
header .sync{margin-left:auto;font-size:12px;opacity:.8}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:650}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--line);color:var(--ink)}
button.primary{background:var(--felt);color:var(--on-felt);font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
button.block{width:100%}
button:disabled{opacity:.45}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}
.score .name{font-size:14px;font-weight:600}
.score .pts{font-size:44px;font-weight:700;line-height:1.05}
.score .vs{color:var(--muted);font-size:14px}
.pa{color:var(--a)} .pb{color:var(--b)}
.verdict{margin-top:12px;text-align:center;padding:10px;border-radius:10px;background:var(--bg);font-weight:600}

/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:44px;padding:10px 6px;background:var(--bg);border:1px solid var(--line)}
.seg button.on{background:var(--felt);color:var(--on-felt);border-color:var(--felt)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{padding:16px 8px;font-weight:650;background:var(--bg);border:2px solid var(--line)}
.who button.on.a{background:var(--a-soft);border-color:var(--a);color:var(--a)}
.who button.on.b{background:var(--b-soft);border-color:var(--b);color:var(--b)}
.calc{font-size:15px;text-align:center;margin:12px 0}
.calc b{font-size:22px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.a{background:var(--a)} .dot.b{background:var(--b)}
.x{background:transparent;color:var(--muted);padding:6px 10px;margin-left:auto}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--felt2);border-color:var(--felt2)}
.pill.due{color:var(--gold);border-color:var(--gold)}

details.sess{border-top:1px solid var(--line);padding:12px 0}
details.sess:first-of-type{border-top:0;padding-top:0}
details.sess summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center}
details.sess summary::-webkit-details-marker{display:none}
.sess .body{padding-top:10px}

/* cassa */
.big{font-size:40px;font-weight:700;line-height:1.1}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0 6px}
.bar span{display:block;height:100%}
.bar .a{background:var(--a)} .bar .b{background:var(--b)}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:transparent;border-radius:0;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--felt2);font-weight:650}
@media (prefers-color-scheme: dark){ nav button.on{color:var(--gold)} }

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.empty{text-align:center;padding:24px 8px}
</style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
  <h1>Cassa Backgammon</h1>
  <button class="sync" id="sync" data-act="syncNow" style="background:transparent;color:inherit;padding:4px 0">…</button>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="sessione"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Giornata</button>
  <button data-tab="storico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Storico</button>
  <button data-tab="cassa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5h8v2M3 12h18"/></svg>Cassa</button>
  <button data-tab="impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Impostazioni</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ===================== Dati ===================== */
const KEY = 'bg_cassa_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const DEFAULT = () => ({
  version: 1,
  players: { a: 'Claudio', b: 'Roberto' },
  sessions: [],   // {id,date,euroPerPoint,closed,paid,games:[{id,winner,points,tipo,cubo}]}
  withdrawals: [],// {id,date,amount,note}
  deleted: [],    // id eliminati (per non farli ricomparire con la sincronizzazione)
  playersMod: null,
  updatedAt: null
});
let state = load();
let ui = { tab: 'sessione', winner: null, tipo: 1, cubo: 1 };

function normalize(d){ return { ...DEFAULT(), ...d, deleted: d.deleted || [], withdrawals: d.withdrawals || [] }; }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.sessions) return normalize(s); } catch(e){}
  return DEFAULT();
}
// Ogni giornata/spesa modificata riceve un timestamp "mod": serve a unire i dati fra dispositivi.
let snap = {};
const sig = o => JSON.stringify({ ...o, mod: undefined });
function snapshot(){ snap = {}; [...state.sessions, ...state.withdrawals].forEach(o => snap[o.id] = sig(o)); }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('Impossibile salvare in locale'); } }
function save(){
  const now = new Date().toISOString();
  [...state.sessions, ...state.withdrawals].forEach(o => { if (snap[o.id] !== sig(o)) o.mod = now; });
  state.updatedAt = now; snapshot(); persist(); setDirty(true);
}
const tomb = id => { if (!state.deleted.includes(id)) state.deleted.push(id); };

/* ===================== Calcoli ===================== */
const eur = n => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const fmtDate = iso => new Date(iso+'T12:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const name = k => state.players[k];
const other = k => k === 'a' ? 'b' : 'a';

function tally(s){
  const t = { a:0, b:0 };
  s.games.forEach(g => t[g.winner] += g.points);
  const diff = t.a - t.b;
  const loser = diff > 0 ? 'b' : diff < 0 ? 'a' : null;
  const pts = Math.abs(diff);
  return { a:t.a, b:t.b, diff, loser, winner: loser ? other(loser) : null, pts, euro: pts * (s.euroPerPoint||0) };
}
function totals(){
  const debt = { a:0, b:0 }, paid = { a:0, b:0 }, lost = { a:0, b:0 }, won = { a:0, b:0 };
  state.sessions.filter(s => s.closed).forEach(s => {
    const r = tally(s);
    if (!r.loser) return;
    debt[r.loser] += r.euro; lost[r.loser]++; won[r.winner]++;
    if (s.paid) paid[r.loser] += r.euro;
  });
  const withdrawn = state.withdrawals.reduce((x,w) => x + w.amount, 0);
  const totalDebt = debt.a + debt.b, totalPaid = paid.a + paid.b;
  return { debt, paid, lost, won, totalDebt, totalPaid, withdrawn, cassa: totalPaid - withdrawn, daVersare: totalDebt - totalPaid };
}
const openSession = () => state.sessions.find(s => !s.closed);

/* ===================== Render ===================== */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TIPI = [[1,'Semplice'],[2,'Gammon'],[3,'Backgammon']];
const CUBI = [1,2,4,8,16,32,64];

function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  $app.innerHTML = ({ sessione: vSessione, storico: vStorico, cassa: vCassa, impostazioni: vImpostazioni })[ui.tab]();
}

function verdict(s, r){
  if (!s.games.length) return 'Nessuna partita ancora';
  if (!r.loser) return 'Parità: nessuno paga';
  return `${esc(name(r.loser))} deve ${r.pts} punt${r.pts===1?'o':'i'} → <span class="tnum">${eur(r.euro)}</span> in cassa`;
}

function vSessione(){
  const s = openSession();
  if (!s) {
    const last = state.sessions.filter(x=>x.closed).sort((x,y)=>y.date.localeCompare(x.date))[0];
    return `
    <div class="card">
      <h2>Nuova giornata</h2>
      <div class="grid2">
        <div><label class="f">Data</label><input type="date" id="nDate" value="${todayISO()}"></div>
        <div><label class="f">€ per punto</label><input type="number" id="nEur" inputmode="decimal" step="0.5" min="0" value="${last ? last.euroPerPoint : 1}"></div>
      </div>
      <p class="small muted">Ogni giornata è indipendente: il valore del punto si decide oggi e si può cambiare fino alla chiusura.</p>
      <button class="primary block" data-act="newSession">Inizia giornata</button>
    </div>
    ${state.sessions.length ? '' : `<div class="card empty muted">Benvenuti! Iniziate la prima giornata qui sopra.</div>`}`;
  }
  const r = tally(s);
  const p = ui.tipo * ui.cubo;
  const games = s.games.slice().reverse().map((g,i) => `
    <li><span class="dot ${g.winner}"></span>
      <span><b>${esc(name(g.winner))}</b> +${g.points}
      <span class="small muted"> · ${TIPI.find(t=>t[0]===g.tipo)?.[1]||''}${g.cubo>1?' · cubo '+g.cubo:''}</span></span>
      <span class="small muted" style="margin-left:auto">#${s.games.length-i}</span>
      <button class="x" data-act="delGame" data-id="${g.id}" aria-label="Elimina">✕</button></li>`).join('');
  return `
  <div class="card">
    <div class="row between" style="margin-bottom:12px">
      <input type="date" id="sDate" value="${s.date}" style="width:auto;padding:6px 8px" aria-label="Data giornata">
      <span class="row small muted" style="gap:6px;width:auto">€/punto
        <input type="number" id="sEur" inputmode="decimal" step="0.5" min="0" value="${s.euroPerPoint}" style="width:80px;padding:6px 8px"></span>
    </div>
    <div class="score">
      <div><div class="name pa">${esc(name('a'))}</div><div class="pts pa tnum">${r.a}</div></div>
      <div class="vs">–</div>
      <div><div class="name pb">${esc(name('b'))}</div><div class="pts pb tnum">${r.b}</div></div>
    </div>
    <div class="verdict">${verdict(s,r)}</div>
  </div>

  <div class="card">
    <h2>Partita vinta da</h2>
    <div class="who">
      <button class="a ${ui.winner==='a'?'on':''}" data-act="who" data-k="a">${esc(name('a'))}</button>
      <button class="b ${ui.winner==='b'?'on':''}" data-act="who" data-k="b">${esc(name('b'))}</button>
    </div>
    <label class="f" style="margin-top:14px">Tipo di vittoria</label>
    <div class="seg">${TIPI.map(([v,l]) => `<button class="${ui.tipo===v?'on':''}" data-act="tipo" data-v="${v}">${l}</button>`).join('')}</div>
    <label class="f" style="margin-top:14px">Cubo</label>
    <div class="seg">${CUBI.map(v => `<button class="${ui.cubo===v?'on':''}" data-act="cubo" data-v="${v}">${v}</button>`).join('')}</div>
    <div class="calc">${ui.tipo} × ${ui.cubo} = <b class="tnum">${p}</b> punt${p===1?'o':'i'}</div>
    <button class="primary block" data-act="addGame" ${ui.winner?'':'disabled'}>${ui.winner ? `Aggiungi +${p} a ${esc(name(ui.winner))}` : 'Scegli chi ha vinto'}</button>
  </div>

  <div class="card">
    <h2>Partite della giornata (${s.games.length})</h2>
    ${s.games.length ? `<ul class="list">${games}</ul>` : '<p class="muted small" style="margin:0">Le partite registrate compariranno qui.</p>'}
  </div>

  <div class="grid2">
    <button class="danger" data-act="dropSession">Annulla giornata</button>
    <button class="primary" data-act="closeSession">Chiudi giornata</button>
  </div>`;
}

function vStorico(){
  const list = state.sessions.slice().sort((x,y) => y.date.localeCompare(x.date));
  if (!list.length) return `<div class="card empty muted">Nessuna giornata registrata.</div>`;
  return `<div class="card"><h2>Giornate (${list.length})</h2>${list.map(s => {
    const r = tally(s);
    const status = !s.closed ? '<span class="pill">in corso</span>'
      : !r.loser ? '<span class="pill">pari</span>'
      : s.paid ? '<span class="pill ok">versato</span>' : '<span class="pill due">da versare</span>';
    return `<details class="sess" ${ui.openId===s.id?'open':''}>
      <summary>
        <span class="dot ${r.winner||''}" style="${r.winner?'':'background:var(--line)'}"></span>
        <span><b>${fmtDate(s.date)}</b><br><span class="small muted tnum">${esc(name('a'))} ${r.a} – ${r.b} ${esc(name('b'))} · ${s.games.length} partite</span></span>
        <span style="margin-left:auto;text-align:right"><span class="tnum">${r.loser ? eur(r.euro) : '—'}</span><br>${status}${s.sent?' <span class="pill">inviata</span>':''}</span>
      </summary>
      <div class="body">
        <p class="small" style="margin:0 0 8px">${r.loser ? `Vince <b>${esc(name(r.winner))}</b> di ${r.pts} punti · ${esc(name(r.loser))} versa ${eur(r.euro)} (${eur(s.euroPerPoint)}/punto)` : 'Parità'}</p>
        <ul class="list small">${s.games.map((g,i)=>`<li><span class="dot ${g.winner}"></span>#${i+1} ${esc(name(g.winner))} +${g.points}<span class="muted">${g.cubo>1?' · cubo '+g.cubo:''}${g.tipo>1?' · '+TIPI[g.tipo-1][1]:''}</span></li>`).join('')}</ul>
        <div class="row small muted" style="margin-top:10px">Data
          <input type="date" class="histDate" data-id="${s.id}" value="${s.date}" style="width:auto;padding:6px 8px"></div>
        <div class="row" style="margin-top:10px;flex-wrap:wrap">
          ${s.closed ? `<button class="primary" data-act="send" data-id="${s.id}">${s.sent?'Invia di nuovo':'Invia giornata'}</button>`:''}
          ${s.closed && r.loser ? `<button class="ghost" data-act="togglePaid" data-id="${s.id}">${s.paid?'Segna non versato':'Segna versato'}</button>`:''}
          ${s.closed ? `<button class="ghost" data-act="reopen" data-id="${s.id}">Riapri</button>`:''}
          <button class="danger" data-act="delSession" data-id="${s.id}">Elimina</button>
        </div>
      </div>
    </details>`; }).join('')}</div>`;
}

function vCassa(){
  const t = totals();
  const pa = t.totalDebt ? t.debt.a / t.totalDebt * 100 : 50;
  const person = k => `
    <div>
      <div class="name ${k==='a'?'pa':'pb'}" style="font-weight:650">${esc(name(k))}</div>
      <div class="tnum" style="font-size:24px;font-weight:700">${eur(t.debt[k])}</div>
      <div class="small muted">${t.totalDebt ? Math.round(t.debt[k]/t.totalDebt*100) : 0}% del totale</div>
      <div class="small muted">giornate perse: ${t.lost[k]} · vinte: ${t.won[k]}</div>
      ${t.debt[k]-t.paid[k] > 0 ? `<div class="small" style="color:var(--gold)">da versare: ${eur(t.debt[k]-t.paid[k])}</div>`:''}
    </div>`;
  return `
  <div class="card" style="background:var(--felt);color:var(--on-felt);border-color:var(--felt)">
    <h2 style="color:var(--on-felt);opacity:.75">Fondo cena</h2>
    <div class="big tnum">${eur(t.totalDebt - t.withdrawn)}</div>
    <div class="small" style="opacity:.8">accumulato ${eur(t.totalDebt)}${t.withdrawn?` · speso ${eur(t.withdrawn)}`:''}${t.daVersare>0?` · di cui ancora da versare ${eur(t.daVersare)}`:''}</div>
  </div>
  <div class="card">
    <h2>Chi ha contribuito</h2>
    <div class="grid2">${person('a')}${person('b')}</div>
    <div class="bar"><span class="a" style="width:${pa}%"></span><span class="b" style="width:${100-pa}%"></span></div>
    <p class="small muted" style="margin:0">Somma dei debiti di ogni giornata chiusa. I punti non passano da una giornata all'altra.</p>
  </div>
  <div class="card">
    <h2>Cena fatta / spesa</h2>
    <div class="grid2">
      <div><label class="f">Importo €</label><input type="number" id="wAmt" inputmode="decimal" step="0.5" min="0" placeholder="0"></div>
      <div><label class="f">Data</label><input type="date" id="wDate" value="${todayISO()}"></div>
    </div>
    <div style="margin-top:10px"><label class="f">Nota</label><input id="wNote" placeholder="es. Pizzeria da Gino"></div>
    <button class="primary block" style="margin-top:12px" data-act="addW">Registra spesa</button>
    ${state.withdrawals.length ? `<ul class="list small" style="margin-top:12px">${state.withdrawals.slice().reverse().map(w=>`

      <button class="x" style="margin-left:0" data-act="delW" data-id="${w.id}">✕</button></li>`).join('')}</ul>` : ''}
  </div>`;
}

/* ===================== Azioni ===================== */
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1800); }
const num = id => { const v = parseFloat(String(document.getElementById(id).value).replace(',','.')); return isNaN(v) ? 0 : v; };
const findS = id => state.sessions.find(s => s.id === id);

const actions = {
  newSession(){ state.sessions.push({ id:uid(), date: document.getElementById('nDate').value || todayISO(), euroPerPoint: num('nEur'), closed:false, paid:false, games:[] }); ui.winner=null; save(); },
  who(el){ ui.winner = el.dataset.k; },
  tipo(el){ ui.tipo = +el.dataset.v; },
  cubo(el){ ui.cubo = +el.dataset.v; },
  addGame(){
    const s = openSession(); if (!s || !ui.winner) return;
    const pts = ui.tipo * ui.cubo;
    s.games.push({ id:uid(), winner: ui.winner, points: pts, tipo: ui.tipo, cubo: ui.cubo });
    toast(`+${pts} a ${name(ui.winner)}`);
    ui.winner = null; ui.tipo = 1; ui.cubo = 1; save();
  },
  delGame(el){ const s = openSession(); if (!confirm('Eliminare questa partita?')) return; s.games = s.games.filter(g => g.id !== el.dataset.id); save(); },
  closeSession(){
    const s = openSession(), r = tally(s);
    if (!s.games.length) { toast('Nessuna partita registrata'); return; }
    if (!confirm(r.loser ? `Chiudere la giornata?\n${name(r.loser)} deve ${eur(r.euro)} alla cassa.` : 'Chiudere la giornata in parità?')) return;
    s.closed = true; save(); ui.tab = 'storico'; ui.openId = s.id; toast('Giornata chiusa'); sync();
  },
  dropSession(){ if (!confirm('Annullare la giornata in corso? Le partite andranno perse.')) return; const s = openSession(); tomb(s.id); state.sessions = state.sessions.filter(x => x !== s); save(); },
  togglePaid(el){ const s = findS(el.dataset.id); s.paid = !s.paid; save(); },
  reopen(el){
    if (openSession()) { toast('C\'è già una giornata in corso'); return; }
    findS(el.dataset.id).closed = false; save(); ui.tab = 'sessione';
  },
  delSession(el){ if (!confirm('Eliminare definitivamente questa giornata?')) return; tomb(el.dataset.id); state.sessions = state.sessions.filter(s => s.id !== el.dataset.id); save(); },
  addW(){
    const amt = num('wAmt'); if (amt <= 0) { toast('Inserisci un importo'); return; }
    state.withdrawals.push({ id:uid(), date: document.getElementById('wDate').value || todayISO(), amount: amt, note: document.getElementById('wNote').value.trim() });
    save(); toast('Spesa registrata');
  },
  delW(el){ if (!confirm('Eliminare questa spesa?')) return; tomb(el.dataset.id); state.withdrawals = state.withdrawals.filter(w => w.id !== el.dataset.id); save(); },
  saveNames(){
    state.players.a = document.getElementById('pA').value.trim() || 'Giocatore 1';
    state.players.b = document.getElementById('pB').value.trim() || 'Giocatore 2';
    state.playersMod = new Date().toISOString(); save(); toast('Nomi salvati');
  },
  export(){
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backgammon_${todayISO()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  },
  import(){ document.getElementById('fileIn').click(); },
  send(el){ sendSession(findS(el.dataset.id)); },
  demo(){
    if (state.sessions.length && !confirm('Sostituire i dati attuali con i dati di esempio?')) return;
    const g = (w,t,c) => ({ id:uid(), winner:w, tipo:t, cubo:c, points:t*c });
    state = DEFAULT();
    state.sessions = [
      { id:uid(), date:'2026-10-04', euroPerPoint:1,   closed:true, paid:true,  games:[g('a',1,1),g('b',2,2),g('a',1,2),g('a',1,1),g('b',1,1)] },
      { id:uid(), date:'2026-10-18', euroPerPoint:0.5, closed:true, paid:true,  games:[g('a',2,1),g('a',1,4),g('b',1,1),g('a',1,2)] },
      { id:uid(), date:'2026-11-01', euroPerPoint:1,   closed:true, paid:true,  games:[g('b',1,2),g('b',3,1),g('a',1,1),g('b',1,1)] },
      { id:uid(), date:'2026-11-15', euroPerPoint:2,   closed:true, paid:false, games:[g('a',1,1),g('b',1,1),g('b',2,2),g('a',1,1),g('b',1,1)] },
    ];
    save(); ui.tab = 'cassa'; toast('Dati di esempio caricati');
  },
  reset(){ if (!confirm(ghOn() ? 'Cancellare i dati su questo dispositivo? Verranno ricaricati da GitHub alla prossima sincronizzazione.' : 'Cancellare TUTTI i dati?')) return; state = DEFAULT(); snapshot(); persist(); setDirty(false); if (ghOn()) sync(true); },
  syncNow(){ sync(true); },
  ghSave(){
    gh = { owner: val('ghOwner'), repo: val('ghRepo'), path: val('ghPath') || 'registro.json', token: val('ghToken') || gh.token };
    try { localStorage.setItem(GHKEY, JSON.stringify(gh)); } catch(e){}
    paintSync(); sync(true);
  },
  ghOff(){ if (!confirm('Scollegare GitHub da questo dispositivo? I dati locali restano.')) return; gh.token = ''; try { localStorage.setItem(GHKEY, JSON.stringify(gh)); } catch(e){} paintSync(); },
};

/* ===================== Sincronizzazione GitHub ===================== */
const GHKEY = 'bg_gh_cfg', METAKEY = 'bg_sync_meta';
const readLS = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
let gh = readLS(GHKEY) || { owner:'csdelvai-git', repo:'backgammon-dati', path:'registro.json', token:'' };
let meta = readLS(METAKEY) || { dirty:false, last:null };
let syncing = false, syncErr = '';
const ghOn = () => !!gh.token;
const val = id => document.getElementById(id).value.trim();
function setDirty(v){ meta.dirty = v; try { localStorage.setItem(METAKEY, JSON.stringify(meta)); } catch(e){} paintSync(); }
function paintSync(){
  const el = document.getElementById('sync'); if (!el) return;
  el.textContent = !ghOn() ? 'solo su questo dispositivo'
    : syncing ? '⟳ sincronizzo…'
    : syncErr ? '⚠ ' + syncErr
    : meta.dirty ? '● da sincronizzare' : '✓ sincronizzato';
}
const b64enc = str => { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')), c => c.charCodeAt(0)));
function ghFetch(method, body){
  const url = `https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}`;
  return fetch(url, { method, cache:'no-store', body: body && JSON.stringify(body),
    headers: { Authorization:`Bearer ${gh.token}`, Accept:'application/vnd.github+json' } });
}
const ghError = st => st === 401 ? 'token non valido' : st === 403 ? 'token senza permessi' : st === 404 ? 'repo non trovato' : 'errore GitHub ' + st;
// Unione: per ogni giornata/spesa vince la versione modificata più di recente; gli eliminati restano eliminati.
function merge(L, R){
  const del = [...new Set([...(L.deleted||[]), ...(R.deleted||[])])].sort();
  const arr = (a = [], b = []) => {
    const m = new Map();
    for (const o of b) m.set(o.id, o);
    for (const o of a) { const x = m.get(o.id); if (!x || (o.mod||'') >= (x.mod||'')) m.set(o.id, o); }
    return [...m.values()].filter(o => !del.includes(o.id)).sort((x,y) => x.id < y.id ? -1 : 1);
  };
  const lp = (L.playersMod||'') >= (R.playersMod||'');
  return { version:1, players: lp ? L.players : R.players, playersMod: (lp ? L.playersMod : R.playersMod) || null,
    sessions: arr(L.sessions, R.sessions), withdrawals: arr(L.withdrawals, R.withdrawals), deleted: del,
    updatedAt: [L.updatedAt, R.updatedAt].filter(Boolean).sort().pop() || null };
}
async function sync(manual, attempt = 0){
  if (!ghOn()) { if (manual) { ui.tab = 'impostazioni'; render(); toast('Collega GitHub qui sotto'); } return; }
  if (syncing) return;
  syncing = true; syncErr = ''; paintSync();
  try {
    let r = await ghFetch('GET'), remote = null, sha = null;
    if (r.status === 200) { const j = await r.json(); sha = j.sha; remote = normalize(JSON.parse(b64dec(j.content))); }
    else if (r.status !== 404) throw new Error(ghError(r.status));
    const before = JSON.stringify(state);
    const merged = remote ? merge(state, remote) : merge(state, { players:{}, sessions:[], withdrawals:[], deleted:[] });
    const needPush = !remote || JSON.stringify(merged) !== JSON.stringify(merge(remote, { players:{}, sessions:[], withdrawals:[], deleted:[] }));
    if (needPush) {
      const body = { message: `Registro aggiornato ${new Date().toLocaleString('it-IT')}`, content: b64enc(JSON.stringify(merged, null, 1)) };
      if (sha) body.sha = sha;
      r = await ghFetch('PUT', body);
      if ((r.status === 409 || r.status === 422) && attempt < 2) { syncing = false; return sync(manual, attempt + 1); } // modificato altrove nel frattempo
      if (!r.ok) throw new Error(ghError(r.status));
    }
    state = merged; snapshot(); persist();
    meta.last = new Date().toISOString(); setDirty(false);
    if (manual) toast(needPush ? 'Registro salvato su GitHub' : 'Già aggiornato');
    if (JSON.stringify(state) !== before && !document.activeElement?.matches('input')) render();
  } catch(e) {
    syncErr = e instanceof TypeError ? 'offline' : e.message;
    if (manual) toast('Sincronizzazione non riuscita: ' + syncErr);
  } finally { syncing = false; paintSync(); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && meta.dirty) sync(); });
window.addEventListener('online', () => { if (meta.dirty) sync(); });

/* ===================== Invio e importazione giornate ===================== */
function sessionText(s){
  const r = tally(s);
  const lines = [`Backgammon · ${fmtDate(s.date)}`,
    `${name('a')} ${r.a} – ${r.b} ${name('b')} (${s.games.length} partite, ${eur(s.euroPerPoint)}/punto)`,
    r.loser ? `${name(r.loser)} versa ${eur(r.euro)} in cassa` : 'Parità: nessuno versa'];
  return lines.join('\n');
}
async function sendSession(s){
  const payload = { type:'bg-giornata', version:1, players: state.players, session: { ...s, sent: undefined } };
  const fname = `giornata_${s.date}.txt`; // .txt: Android/WhatsApp accettano la condivisione di file di testo
  const file = new File([JSON.stringify(payload, null, 1)], fname, { type:'text/plain' });
  const text = sessionText(s);
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title:`Giornata ${s.date}`, text });
      s.sent = true; save(); render(); toast('Giornata inviata');
      return;
    }
  } catch(err) { if (err && err.name === 'AbortError') return; }
  // Ripiego: scarica il file e copia il riepilogo
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  try { await navigator.clipboard.writeText(text); } catch(e){}
  s.sent = true; save(); render();
  toast('File scaricato: allegalo a email/WhatsApp');
}
async function importFiles(files){
  let added = 0, updated = 0, bad = 0;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      if (d.type === 'bg-giornata' && d.session && Array.isArray(d.session.games)) {
        const inc = { ...d.session, closed:true };
        delete inc.sent;
        const i = state.sessions.findIndex(x => x.id === inc.id);
        if (i >= 0) { inc.paid = state.sessions[i].paid || inc.paid; state.sessions[i] = inc; updated++; }
        else { state.sessions.push(inc); added++; }
      } else if (d.sessions && d.players) {
        if (!confirm(`"${f.name}" è un registro completo. Sostituire tutti i dati attuali?`)) continue;
        state = normalize(d); added += d.sessions.length;
      } else bad++;
    } catch(e) { bad++; }
  }
  save(); ui.tab = 'storico'; render();
  toast([added && `${added} aggiunte`, updated && `${updated} aggiornate`, bad && `${bad} file non validi`].filter(Boolean).join(' · ') || 'Nessuna modifica');
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  actions[el.dataset.act](el); render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'sDate' && e.target.value) { openSession().date = e.target.value; save(); toast('Data aggiornata'); }
  if (e.target.classList.contains('histDate') && e.target.value) { findS(e.target.dataset.id).date = e.target.value; save(); render(); toast('Data aggiornata'); }
  if (e.target.id === 'sEur') { const s = openSession(); s.euroPerPoint = num('sEur'); save(); render(); }
  if (e.target.id === 'fileIn') { importFiles([...e.target.files]); e.target.value = ''; }
});
snapshot(); render(); paintSync(); sync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
